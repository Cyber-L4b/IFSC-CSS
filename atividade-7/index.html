<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 7</title>

    <style>
        *{
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }

        .container-chat{
            width: 400px;
            height: 500px;
            padding: 20px;
            background-color: aliceblue;

            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message{
            display: flex;
            align-items: flex-start;
            gap: 10px;
            max-width: 80%; /* SUS */
            padding: 8px 12px;
            border: 1px solid grey;
            border-radius: 10px;
            background-color: white;
            position: relative; /* SUS */
        }

        .mss1{
            align-self: flex-start;
            flex-direction: row; /* SUS */
        }

        
        .mss2{
            align-self: flex-end;
            flex-direction: row-reverse;
            background-color: azure;
        }

        img {
            width: 40px;
            height: 40px;
        }

        .conteudo{
            display: flex;
            flex-direction: column;
        }

        img{
            width: 40px;
            height: 40px;
            float: left;
            margin: 5px;
        }

        .user{
            font-size: 11px;
            font-weight: bold;
            color: darkgray;
            margin-bottom: 2px;
        }

        .texto{
            font-size: 14px;
            margin: 0;
        }
        

        p{
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 14px;
            line-height: 1.4;
        }

        .time{
            align-self: flex-end;
            color: gray;
            font-size: 10px;
            margin-top: 4px;
        }

        .chat{
            border: 1px solid gray;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            
        }

        input{
            margin: 10px;
            height: 50px;
            width: 340px;
        }
        button{
            align-self: flex-end;
            margin: 0px 10px;
        }
    </style>
    
</head>
<body>
    
    <div class="container-chat">
        <div class="message mss1">
            <img src="tony.jpg" alt="imagem-tony">
            <div class="conteudo">
                <span class="user">Sr. Stark</span>
                <p class="texto">Olá garoto, tudo bem?</p>
                <span class="time">00:00</span>
            </div>
        </div>
    
        <div class="message mss2">
            <img src="peter.png" alt="imagem-peter">
            <div class="conteudo">
                <span class="user">Miranha</span>
                <p class="texto">Estou bem sim, e voce?</p>
                <span class="time">00:00</span>
            </div>
        </div>

        <div class="message mss1">
            <img src="tony.jpg" alt="imagem-tony">
            <div class="conteudo">
                <span class="user">Sr. Stark</span>
                <p class="texto">Festa na torre hoje? Até o picole vai estar lá, conto com sua presença</p>
                <span class="time">00:00</span>
            </div>
        </div>

        <div class="message mss2">
            <img src="peter.png" alt="imagem-peter">
            <div class="conteudo">
                <span class="user">Miranha</span>
                <p class="texto">Pode deixar!</p>
                <span class="time">00:00</span>
            </div>
        </div>

        <div class="chat">
            <input type="text" placeholder="Digite sua mensagem...">
            <button>Enviar</button>
        </div>
    </div>

</body>
</html>
