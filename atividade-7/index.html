<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 7</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container-chat{
            width: 400px;
            height: 400px;
            padding: 20px;
            background-color: aliceblue;
        }

        .mss1{
            width: 350px;
            height: 50px;
            border: 1px solid gray;
            border-radius: 10px;

        }

        legend {
            position: absolute;
            top: 15rem;
            font-weight: bold;
            color:darkgray;
            padding: 0 10px; /* Um respiro nas laterais do texto */
        }

        img{
            width: 40px;
            height: 40px;
            float: left;
            margin: 5px;
        }

        p{
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 14px;
            line-height: 1.4;
        }

        .time-1{
            float: right;
            color: gray;
            margin: 0px 5px;
            font-size: 12px;
            top: -1rem;
            position: relative;
        }
    </style>
    
</head>
<body>
    
    <div class="container-chat">
        <div class="mss1">
            <img src="tony.jpg" alt="imagem-tony">
            <legend>Sr. Stark</legend>
            <p>Iae garoto, ta pronto?</p>
            <p class="time-1">00:00</p>
        </div>
    
        <div class="mss2"></div>
        <div class="mss3"></div>
        <div class="mss4"></div>


        <div></div>
    </div>

</body>
</html>
