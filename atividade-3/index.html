<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    

    <h1> Como podemos incluir CSS em documentos HTML?</h1>

    <h2>O CSS pode ser adicionado a documentos HTML de 3 maneiras:</h2>

    <p>
        Inline - usando o styleatributo dentro de elementos HTML <br>
        Interno - usando um style elemento na head seção <br>
        Externo - usando um link elemento para criar um link para um arquivo CSS externo. <br>
    </p>
</body>
</html>
